name: Release

on:
  push:
    tags:
      - "version-*.*.*"
      - "beta-*.*.*-*"
      - "canary-*.*.*-*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release tag and frontend tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      channel: ${{ steps.release-meta.outputs.channel }}
      prerelease: ${{ steps.release-meta.outputs.prerelease }}
      version: ${{ steps.release-meta.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Refuse to replace an already-published release
        shell: bash
        run: |
          if is_draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [ "${is_draft}" != "true" ]; then
              echo "Release ${GITHUB_REF_NAME} is already published; refusing to replace its assets."
              exit 1
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version matches the repository manifests
        id: release-meta
        run: node scripts/verify-release-version.mjs "${GITHUB_REF_NAME}"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Run frontend tests
        run: npm run test -- --run

  publish-release:
    name: Publish ${{ matrix.label }}
    needs: verify-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # Both legs update the same draft release and latest.json. Serializing
      # avoids non-atomic release creation and manifest merge races.
      max-parallel: 1
      matrix:
        include:
          - label: macOS Apple Silicon
            runner: macos-15
            bundleArgs: --bundles app,dmg
          - label: Windows x64
            runner: windows-latest
            bundleArgs: --bundles nsis

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Prepare updater signing configuration
        shell: bash
        run: |
          test -n "${RAW_NEVER_AFK_UPDATER_PUBLIC_KEY}" || {
            echo "Missing repository variable NEVER_AFK_UPDATER_PUBLIC_KEY."
            exit 1
          }
          test -n "${TAURI_SIGNING_PRIVATE_KEY}" || {
            echo "Missing repository secret TAURI_SIGNING_PRIVATE_KEY."
            exit 1
          }

          # `tauri signer generate --ci` writes the public key as base64-wrapped
          # minisign text, which is also the format Tauri's bundler expects when
          # validating updater signatures. Accept either that CI-friendly value
          # or a raw minisign `.pub` block, then export the wrapped form for both
          # the bundler and the runtime updater plugin.
          raw_public_key="$(printf '%s' "${RAW_NEVER_AFK_UPDATER_PUBLIC_KEY}" | tr -d '\r')"
          if decoded_public_key="$(printf '%s' "${raw_public_key}" | base64 --decode 2>/dev/null)" \
            && printf '%s' "${decoded_public_key}" | grep -q '^untrusted comment:'; then
            normalized_public_key="${raw_public_key}"
          elif printf '%s' "${raw_public_key}" | grep -q '^untrusted comment:'; then
            normalized_public_key="$(printf '%s\n' "${raw_public_key}" | base64 | tr -d '\n')"
          else
            echo "Repository variable NEVER_AFK_UPDATER_PUBLIC_KEY is not a minisign public key."
            exit 1
          fi

          if ! printf '%s' "${normalized_public_key}" | grep -Eq '^[A-Za-z0-9+/=]+$'; then
            echo "Normalized updater public key is not a base64-wrapped minisign value."
            exit 1
          fi

          configured_public_key="$(node -e "process.stdout.write(require('./src-tauri/tauri.conf.json').plugins.updater.pubkey)")"
          if [ "${normalized_public_key}" != "${configured_public_key}" ]; then
            echo "Repository variable NEVER_AFK_UPDATER_PUBLIC_KEY does not match src-tauri/tauri.conf.json."
            exit 1
          fi

          {
            echo "NEVER_AFK_UPDATER_PUBLIC_KEY<<__NEVER_AFK_UPDATER_PUBLIC_KEY__"
            printf '%s\n' "${normalized_public_key}"
            echo "__NEVER_AFK_UPDATER_PUBLIC_KEY__"
          } >> "${GITHUB_ENV}"
        env:
          RAW_NEVER_AFK_UPDATER_PUBLIC_KEY: ${{ vars.NEVER_AFK_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Prepare macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for required_name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            APPLE_API_PRIVATE_KEY \
            APPLE_API_KEY \
            APPLE_API_ISSUER; do
            if [ -z "${!required_name}" ]; then
              echo "Missing repository secret ${required_name}."
              exit 1
            fi
          done

          if ! [[ "${APPLE_API_KEY}" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_API_KEY must contain exactly 10 uppercase letters or digits."
            exit 1
          fi
          if ! [[ "${APPLE_API_ISSUER}" =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "APPLE_API_ISSUER must be a UUID."
            exit 1
          fi

          key_path="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          umask 077
          printf '%s\n' "${APPLE_API_PRIVATE_KEY}" > "${key_path}"
          chmod 600 "${key_path}"

          test -s "${key_path}" || {
            echo "APPLE_API_PRIVATE_KEY produced an empty file."
            exit 1
          }
          grep -q '^-----BEGIN PRIVATE KEY-----$' "${key_path}" || {
            echo "APPLE_API_PRIVATE_KEY is missing its BEGIN PRIVATE KEY boundary."
            exit 1
          }
          grep -q '^-----END PRIVATE KEY-----$' "${key_path}" || {
            echo "APPLE_API_PRIVATE_KEY is missing its END PRIVATE KEY boundary."
            exit 1
          }

          # Tauri consumes the identifiers and the temporary path, never the
          # private-key contents through GITHUB_ENV.
          {
            echo "APPLE_API_KEY=${APPLE_API_KEY}"
            echo "APPLE_API_ISSUER=${APPLE_API_ISSUER}"
            echo "APPLE_API_KEY_PATH=${key_path}"
          } >> "${GITHUB_ENV}"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build bundles and publish the GitHub Release
        id: tauri_build
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEVER_AFK_UPDATE_CHANNEL: ${{ needs.verify-release.outputs.channel }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: never-afk ${{ github.ref_name }} (${{ needs.verify-release.outputs.channel }})
          releaseBody: |
            Automatic GitHub release built from tag `${{ github.ref_name }}`.
            Update channel: `${{ needs.verify-release.outputs.channel }}`.

            macOS:
            - Download the DMG and move `never-afk.app` to `Applications`.
            - The app inside the DMG and updater archive is Developer ID signed, notarized, and stapled.
            - When upgrading from an older ad-hoc build, macOS may require removing and re-adding never-afk in Accessibility once, followed by an app relaunch.

            Windows:
            - Download the `.exe` installer.
            - SmartScreen may warn because the installer is unsigned.
          generateReleaseNotes: true
          releaseDraft: true
          prerelease: ${{ needs.verify-release.outputs.prerelease == 'true' }}
          args: ${{ matrix.bundleArgs }}

      - name: Verify distributed macOS app bundles
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail

          paths_file="${RUNNER_TEMP}/never-afk-artifact-paths.json"
          printf '%s' "${ARTIFACT_PATHS}" > "${paths_file}"
          jq -e 'type == "array"' "${paths_file}" >/dev/null

          artifact_with_suffix() {
            local suffix="$1"
            local count
            count="$(jq --arg suffix "${suffix}" '[.[] | select(type == "string" and endswith($suffix))] | length' "${paths_file}")"
            if [ "${count}" -ne 1 ]; then
              echo "Expected exactly one artifact ending in ${suffix}; found ${count}."
              jq -r '.[]' "${paths_file}"
              exit 1
            fi
            jq -r --arg suffix "${suffix}" '.[] | select(type == "string" and endswith($suffix))' "${paths_file}"
          }

          verify_app() {
            local app_path="$1"
            local signing_details

            codesign --verify --deep --strict --verbose=2 "${app_path}"
            signing_details="$(codesign --display --verbose=4 "${app_path}" 2>&1)"
            printf '%s\n' "${signing_details}" | grep -Fqx 'Authority=Developer ID Application: Bernardo Aleman Siverio (4986B9LPRE)'
            printf '%s\n' "${signing_details}" | grep -Fqx 'TeamIdentifier=4986B9LPRE'
            printf '%s\n' "${signing_details}" | grep -Eq 'flags=.*runtime'
            xcrun stapler validate "${app_path}"
            spctl --assess --type execute --verbose=4 "${app_path}"
          }

          app_path="$(artifact_with_suffix '.app')"
          dmg_path="$(artifact_with_suffix '.dmg')"
          updater_archive_path="$(artifact_with_suffix '.app.tar.gz')"
          test -d "${app_path}"
          test -f "${dmg_path}"
          test -f "${updater_archive_path}"

          mount_dir="$(mktemp -d "${RUNNER_TEMP}/never-afk-dmg.XXXXXX")"
          archive_dir="$(mktemp -d "${RUNNER_TEMP}/never-afk-updater.XXXXXX")"
          cleanup_artifacts() {
            hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true
            rm -rf "${mount_dir}" "${archive_dir}"
          }
          trap cleanup_artifacts EXIT

          verify_app "${app_path}"

          hdiutil attach "${dmg_path}" -nobrowse -readonly -mountpoint "${mount_dir}" >/dev/null
          dmg_app="${mount_dir}/never-afk.app"
          test -d "${dmg_app}"
          verify_app "${dmg_app}"
          hdiutil detach "${mount_dir}" >/dev/null

          tar -xzf "${updater_archive_path}" -C "${archive_dir}"
          updater_app_count="$(find "${archive_dir}" -type d -name '*.app' -prune | wc -l | tr -d ' ')"
          if [ "${updater_app_count}" -ne 1 ]; then
            echo "Expected exactly one app in the updater archive; found ${updater_app_count}."
            exit 1
          fi
          updater_app="$(find "${archive_dir}" -type d -name '*.app' -prune | head -n 1)"
          verify_app "${updater_app}"
        env:
          ARTIFACT_PATHS: ${{ steps.tauri_build.outputs.artifactPaths }}

      - name: Remove temporary notarization key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ "${APPLE_API_KEY}" =~ ^[A-Z0-9]{10}$ ]]; then
            rm -f "${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          fi
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}

  publish-verified-release:
    name: Publish verified release
    needs: [verify-release, publish-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Verify draft assets and publish
        shell: bash
        run: |
          set -euo pipefail

          release_json="${RUNNER_TEMP}/never-afk-release.json"
          gh release view "${GITHUB_REF_NAME}" --json isDraft,assets > "${release_json}"
          jq -e '.isDraft == true' "${release_json}" >/dev/null

          expected_assets=(
            'latest.json'
            "never-afk_${RELEASE_VERSION}_aarch64.dmg"
            "never-afk_${RELEASE_VERSION}_x64-setup.exe"
            "never-afk_${RELEASE_VERSION}_x64-setup.exe.sig"
            'never-afk_aarch64.app.tar.gz'
            'never-afk_aarch64.app.tar.gz.sig'
          )
          if [ "$(jq '.assets | length' "${release_json}")" -ne "${#expected_assets[@]}" ]; then
            echo "Draft release does not contain the expected number of assets."
            jq -r '.assets[].name' "${release_json}"
            exit 1
          fi
          for asset_name in "${expected_assets[@]}"; do
            jq -e --arg name "${asset_name}" '.assets | any(.name == $name)' "${release_json}" >/dev/null || {
              echo "Draft release is missing ${asset_name}."
              exit 1
            }
          done

          manifest_path="${RUNNER_TEMP}/latest.json"
          gh release download "${GITHUB_REF_NAME}" --pattern latest.json --output "${manifest_path}" --clobber

          macos_updater_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/never-afk_aarch64.app.tar.gz"
          windows_updater_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/never-afk_${RELEASE_VERSION}_x64-setup.exe"

          # Tauri emits both the generic and installer-specific platform keys.
          # Each pair intentionally points to the same signed updater bundle;
          # the DMG remains a separate manual-install asset verified above.
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            --arg macos_url "${macos_updater_url}" \
            --arg windows_url "${windows_updater_url}" '
              .version == $version and
              (.platforms | type == "object") and
              (.platforms as $platforms | [
                  ["darwin-aarch64", $macos_url],
                  ["darwin-aarch64-app", $macos_url],
                  ["windows-x86_64", $windows_url],
                  ["windows-x86_64-nsis", $windows_url]
                ] | all(
                  . as [$platform, $expected_url] |
                  ($platforms[$platform] | type == "object") and
                  ($platforms[$platform].url == $expected_url) and
                  ($platforms[$platform].signature | type == "string" and length > 0)
                ))
            ' "${manifest_path}" >/dev/null

          gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.verify-release.outputs.version }}

  publish-channel-manifest:
    name: Publish channel manifest
    needs: [verify-release, publish-verified-release]
    if: needs.verify-release.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download generated updater manifest
        run: gh release download "${GITHUB_REF_NAME}" --pattern latest.json --output latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Publish latest manifest for channel
        shell: bash
        run: |
          manifest_tag="latest-${CHANNEL}"
          if ! gh release view "${manifest_tag}" >/dev/null 2>&1; then
            gh release create "${manifest_tag}" \
              --title "never-afk latest ${CHANNEL} manifest" \
              --notes "Mutable updater manifest for the ${CHANNEL} channel." \
              --prerelease
          fi

          gh release upload "${manifest_tag}" latest.json --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHANNEL: ${{ needs.verify-release.outputs.channel }}
