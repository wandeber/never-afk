<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="210" y1="120" x2="820" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#252b2f"/>
      <stop offset="0.52" stop-color="#11171b"/>
      <stop offset="1" stop-color="#070a0d"/>
    </linearGradient>
    <linearGradient id="energy" x1="374" y1="248" x2="650" y2="776" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d6ff44"/>
      <stop offset="0.55" stop-color="#8df20b"/>
      <stop offset="1" stop-color="#55c900"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18" result="blur"/>
      <feFlood flood-color="#8efc14" flood-opacity="0.38"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="plate-shadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect
    x="88"
    y="88"
    width="848"
    height="848"
    rx="186"
    fill="url(#plate)"
    filter="url(#plate-shadow)"
  />
  <rect
    x="108"
    y="108"
    width="808"
    height="808"
    rx="168"
    fill="none"
    stroke="#3b444a"
    stroke-width="7"
    opacity="0.58"
  />

  <g filter="url(#soft-glow)">
    <circle
      cx="512"
      cy="512"
      r="278"
      fill="none"
      stroke="url(#energy)"
      stroke-width="72"
    />
    <path
      d="M546 300 408 516c-12 18-2 42 19 42h94l-38 166c-6 25 25 42 41 21l136-174c14-18 2-44-21-44h-90l37-207c5-27-25-43-40-20Z"
      fill="url(#energy)"
      stroke="#e8ff83"
      stroke-width="7"
      stroke-linejoin="round"
    />
  </g>
</svg>
